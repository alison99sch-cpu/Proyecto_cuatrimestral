<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS uñas</title>
    <!-- Vinculación con arch js:-->
    <script src="form.js" defer></script>
    <link rel="shortcut icon" href="Imagenes/icono/preguntas.svg" type="image/svg" >

    <link rel="stylesheet" href="style.css">

     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Festive&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    

</head>
<body>
    <h1>SOS uñas!</h1>
    <form action="" id="form">
        <fieldset>
        <legend>Datos personales:</legend>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nomb" name="nombre"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        </fieldset>
        <br><br>

       <fieldset>
        <legend>¿En qué puedo ayudarte?:</legend>

        <div class="opciones">
        <input type="radio" id="duda" name="consulta" value="duda">
        <label for="duda">Tengo una duda/pregunta</label><br>
        </div>

        <div class="opciones">
        <input type="radio" id="idea" name="consulta" value="idea">
        <label for="idea">Quiero compartir una idea/sugerencia</label><br>
        </div>

        <div class="opciones">
        <input type="radio" id="otro" name="consulta" value="otro">
        <label for="otro">Otro</label><br>
        </div>

        </fieldset>
        <br><br>

        <fieldset>
            <legend>Puedes escribir tu consulta o sugerencia aquí:</legend>
            <textarea name="mensaje" id="comentario" rows="4" cols="50" placeholder="¡Contame lo que tenés en mente!"></textarea>

        </fieldset>
        <br><br>

        <!--Para mostrar las advertencias de la validación del formulario:-->
        <p class="advertencia" id="advertencia"></p>
        <br>

        <button class="btn-enviar" type="submit">Enviar</button>
        
        
         
   
    </form>
     
</body>
</html>
